name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yaml]"
      - name: pytest
        run: pytest -v
      - name: Smoke test (racepath analyze)
        run: |
          racepath --version
          racepath analyze examples/sram_demo.cdl -o "$RUNNER_TEMP/rp" | tee "$RUNNER_TEMP/rp.txt"
          grep -q "races: 6" "$RUNNER_TEMP/rp.txt"
          test -s "$RUNNER_TEMP/rp/report.html"
